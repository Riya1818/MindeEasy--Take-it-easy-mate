<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindEase - Your Mental Health Companion</title>
    
    <link rel="stylesheet" type="text/css" href="./style.css">
</head>
<body>
    
    <nav>
        <div id="MindEase">MindEase</div> 
        <ul>
            <li>Home</li>
        </ul>
    </nav>

    <div id="chatContainer"> 
        <div id="chatBox">
            <div style="margin: 6px 0;"><strong>AI:</strong> Welcome to MindEase, your Mental Health Companion. How can I support you today?</div>
        </div>
        
        <div id="inputArea">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Type your message..." 
                onkeydown="if(event.key === 'Enter') sendMessage()"
                oninput="toggleSendButton()" 
            >
            <button onclick="sendMessage()">Send</button> 
        </div>
    </div>
    
    <script src="chatbot.js"></script> 
</body>
</html>
